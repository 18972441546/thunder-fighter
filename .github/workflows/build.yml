name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          pip-${{ runner.os }}-

    # 缓存 buildozer 的 SDK / NDK / python-for-android 编译产物，
    # 避免每次重试都全量下载和编译（此前每次约 20 分钟）。
    - name: Cache buildozer (SDK/NDK/p4a artifacts)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-pip openjdk-17-jdk
        sudo apt-get install -y automake libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        sudo apt-get install -y autoconf libltdl-dev libssl-dev libjpeg-dev libpng-dev zlib1g-dev
        sudo apt-get install -y zip unzip

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    - name: Display buildozer version
      run: |
        buildozer --version

    # Gradle 8 + Android Gradle Plugin 需要 Java 17；
    # runner 默认 JAVA_HOME 是 Java 11，这里强制切到 JDK 17，否则 gradlew 静默失败。
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build with buildozer
      run: |
        buildozer android debug
      continue-on-error: false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error
